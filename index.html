        :root {
            --kasavu-gold: #D4AF37;
            --soft-gold: #E5C158;
            --champagne-gold: #F7E7CE;
            --pure-white: #FFFFFF;
            --off-white: #FDFBF7;
            --obsidian: #050806;
            --envelope-dark: #090e0b;
            --envelope-flap: #0d1410;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--obsidian);
            color: var(--off-white);
            overflow: hidden; 
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }

        /* 
         * 1. LUXURY ENVELOPE ENTRY SCREEN
         */
        .envelope-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh; height: 100dvh;
            background: radial-gradient(circle at center, #111914 0%, #050806 100%);
            z-index: 3000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            cursor: pointer;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .envelope-overlay.opened {
            opacity: 0;
            transform: scale(1.08);
            pointer-events: none;
        }

        /* Subtle outer gold frame on envelope screen */
        .envelope-border {
            position: absolute;
            top: 18px; left: 18px; right: 18px; bottom: 18px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            pointer-events: none;
            z-index: 1;
        }

        .envelope-border::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 0.5px solid rgba(212, 175, 55, 0.15);
        }

        /* Top Envelope Flap */
        .envelope-flap-top {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 56%;
            background: linear-gradient(180deg, #131b16 0%, #0a100c 100%);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top center;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 3;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
        }

        /* Gold trim along the V-edge of the top flap */
        .envelope-flap-edge {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 56.3%;
            background: linear-gradient(90deg, rgba(212,175,55,0.15), rgba(247,231,206,0.7), rgba(212,175,55,0.15));
            clip-path: polygon(0 0, 100% 0, 50% 100%, 49.6% 99.4%, 0 0.5%);
            transform-origin: top center;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
        }

        /* Bottom Pocket Lines */
        .envelope-pocket-bottom {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 55%;
            background: linear-gradient(0deg, #060907 0%, #0c120e 100%);
            clip-path: polygon(0 100%, 100% 100%, 50% 0);
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            z-index: 1;
        }

        .envelope-overlay.opening .envelope-flap-top,
        .envelope-overlay.opening .envelope-flap-edge {
            transform: rotateX(180deg);
        }

        /* Envelope Center Typography Plaque */
        .envelope-content {
            position: relative;
            z-index: 5;
            text-align: center;
            padding: 25px 15px;
            width: 92%;
            max-width: 440px;
            transition: transform 0.8s ease, opacity 0.8s ease;
        }

        .envelope-overlay.opening .envelope-content {
            transform: translateY(-20px);
            opacity: 0;
        }

        .env-pretitle {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.55rem, 2.2vw, 0.7rem);
            letter-spacing: 5px;
            color: rgba(247, 231, 206, 0.8);
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        /* Indianized Royal Calligraphy Font for Envelope Names */
        .gold-foil-names {
            font-family: 'Tangerine', cursive;
            font-size: clamp(3.8rem, 15vw, 6rem);
            line-height: 0.95;
            margin: 0;
            background: linear-gradient(135deg, #DFB94C 0%, #FFF2A6 30%, #D4AF37 50%, #FFF7C2 70%, #C49B27 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 18px rgba(0,0,0,0.9));
            font-weight: 700;
            padding: 2px 0;
            letter-spacing: 1.5px;
        }

        .env-ampersand {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: clamp(1.3rem, 4.5vw, 1.7rem);
            color: var(--kasavu-gold);
            margin: 2px 0;
            letter-spacing: 2px;
        }

        /* 3D Luxury Gold Wax Seal */
        .wax-seal-wrapper {
            margin: 28px auto 12px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wax-seal {
            width: 74px;
            height: 74px;
            border-radius: 50%;

                inset 0 -4px 8px rgba(0,0,0,0.6),
                0 0 20px rgba(212, 175, 55, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: sealPulse 2.5s infinite ease-in-out;
            border: 1.5px solid rgba(252, 246, 186, 0.5);
        }

        .wax-seal::before {
            content: '';
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border-radius: 50%;
            border: 1px dashed rgba(90, 62, 4, 0.6);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }

            font-family: 'Cinzel Decorative', serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: #4A3200;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
        }

        .tap-prompt {
            font-family: 'Cinzel', serif;
            font-size: 0.62rem;
            letter-spacing: 4px;
            color: var(--champagne-gold);
            text-transform: uppercase;
