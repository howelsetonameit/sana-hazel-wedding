        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--obsidian);
            color: var(--off-white);
            overflow: hidden; 
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;

        /* 
         * 1. LUXURY ENVELOPE ENTRY SCREEN
         */
        .envelope-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh; height: 100dvh;
            background: radial-gradient(circle at center, #111914 0%, #050806 100%);
            z-index: 3000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            cursor: pointer;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .envelope-overlay.opened {
            opacity: 0;
            transform: scale(1.08);
            pointer-events: none;
        }

        /* Subtle outer gold frame on envelope screen */
        .envelope-border {
            position: absolute;
            top: 18px; left: 18px; right: 18px; bottom: 18px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            pointer-events: none;
            z-index: 1;
        }

        .envelope-border::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 0.5px solid rgba(212, 175, 55, 0.15);
        }

        /* Top Envelope Flap */
        .envelope-flap-top {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 56%;
            background: linear-gradient(180deg, #131b16 0%, #0a100c 100%);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top center;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 3;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
        }

        /* Gold trim along the V-edge of the top flap */
        .envelope-flap-edge {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 56.3%;
            background: linear-gradient(90deg, rgba(212,175,55,0.15), rgba(247,231,206,0.7), rgba(212,175,55,0.15));
            clip-path: polygon(0 0, 100% 0, 50% 100%, 49.6% 99.4%, 0 0.5%);
            transform-origin: top center;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
        }
